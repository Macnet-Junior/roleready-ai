services:
  - type: web
    name: roleready-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_DOCS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
